<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esports Pro Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #05070a;
            --neon-blue: #3b82f6;
            --cyber-purple: #a855f7;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .filter-active {
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            color: white;
            box-shadow: 0 0 10px rgba(59,130,246,0.6);
            border: none !important;
        }
        h1, h2, h3, .rajdhani { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); }
        .neon-border-blue { border: 1px solid var(--neon-blue); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .neon-glow-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        .active-tab { color: var(--neon-blue); filter: drop-shadow(0 0 5px var(--neon-blue)); }
        .marquee { overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--glass-border); }
        .marquee-content { display: inline-block; animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .hero-anim { animation: heroFadeIn 0.8s ease-out; }
        @keyframes heroFadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .tab-content { display: none; padding-bottom: 100px; }
        .tab-content.active { display: block; }
        .diamond-btn { width: 55px; height: 55px; transform: rotate(45deg); background: linear-gradient(135deg, var(--neon-blue), var(--cyber-purple)); border: none; margin-top: -25px; }
        .diamond-btn i { transform: rotate(-45deg); }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--cyber-purple)); transition: width 0.5s ease; }
        input { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; outline: none; }
        input:focus { border-color: var(--neon-blue) !important; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="max-w-[448px] mx-auto min-h-screen relative">

    <div id="auth-screen" class="fixed inset-0 z-[100] bg-[#05070a] flex flex-col items-center justify-center p-6">
        <div class="w-full space-y-6">
            <h1 class="text-4xl font-bold text-center text-blue-500 mb-8">ARENA LOGIN</h1>
            <div id="auth-error" class="text-red-500 text-sm text-center hidden"></div>
            <div id="login-form" class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" class="w-full p-4 rounded-xl glass">
                <input type="password" id="auth-password" placeholder="Password" class="w-full p-4 rounded-xl glass">
                <button onclick="handleAuth('signin')" class="w-full p-4 rounded-xl bg-blue-600 font-bold rajdhani text-xl">SIGN IN</button>
                <p class="text-center text-sm text-gray-400">New player? <span class="text-blue-400 cursor-pointer" onclick="toggleAuth(true)">Register</span></p>
            </div>
            <div id="signup-form" class="space-y-4 hidden">
                <input type="text" id="reg-user" placeholder="Username" class="w-full p-4 rounded-xl glass">
                <input type="email" id="reg-email" placeholder="Email" class="w-full p-4 rounded-xl glass">
                <input type="password" id="reg-pass" placeholder="Password" class="w-full p-4 rounded-xl glass">
                <button onclick="handleAuth('signup')" class="w-full p-4 rounded-xl bg-purple-600 font-bold rajdhani text-xl">CREATE ACCOUNT</button>
                <p class="text-center text-sm text-gray-400">Joined already? <span class="text-purple-400 cursor-pointer" onclick="toggleAuth(false)">Sign In</span></p>
            </div>
        </div>
    </div>

    <header class="fixed top-0 w-full max-w-[448px] z-50 glass border-b border-white/10">
        <div class="flex justify-between items-center px-4 py-3">
            <img id="app-logo" src="https://placehold.co/120x120" class="w-10 h-10 rounded-full object-cover border-2 border-blue-500 neon-glow-purple">
            <div id="user-avatar" class="w-10 h-10 rounded-full border-2 border-purple-500 neon-glow-purple overflow-hidden">
                <img src="" id="avatar-img" class="w-full h-full object-cover">
            </div>
        </div>
        <div class="marquee bg-blue-600/10 py-1">
            <div id="announcement" class="marquee-content text-[10px] uppercase font-bold text-blue-400">Loading important announcements...</div>
        </div>
    </header>

    <main class="pt-24 px-4 min-h-screen">
        <section id="tab-home" class="tab-content active">
            <div id="hero-banner" class="w-full h-44 rounded-2xl mb-6 glass overflow-hidden hero-anim relative">
                <img id="banner-img" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end p-4">
                    <h2 class="text-2xl font-bold rajdhani" id="banner-text"></h2>
                </div>
            </div>

            <div class="flex gap-2 overflow-x-auto hide-scroll mb-6 py-1" id="filter-tabs">
                <button class="px-4 py-2 rounded-full glass text-xs font-bold whitespace-nowrap filter-active" onclick="filterTournaments('All', this)">ALL</button>
                <button class="px-4 py-2 rounded-full glass text-xs font-bold whitespace-nowrap" onclick="filterTournaments('Upcoming', this)">UPCOMING</button>
                <button class="px-4 py-2 rounded-full glass text-xs font-bold whitespace-nowrap" onclick="filterTournaments('BGMI', this)">BGMI</button>
                <button class="px-4 py-2 rounded-full glass text-xs font-bold whitespace-nowrap" onclick="filterTournaments('FF', this)">FREE FIRE</button>
            </div>

            <div id="tournament-list" class="space-y-4">
            </div>
        </section>

        <section id="tab-matches" class="tab-content">
            <h2 class="text-2xl font-bold rajdhani mb-4">MY REGISTRATIONS</h2>
            <div id="my-matches-list" class="space-y-4"></div>
        </section>

        <section id="tab-play" class="tab-content">
            <div id="lobby-view" class="hidden">
                <div class="glass rounded-2xl p-6 mb-6">
                    <h2 id="lobby-match-title" class="text-2xl font-bold rajdhani text-blue-400"></h2>
                    <div id="timer-container" class="mt-4 p-4 rounded-xl bg-black/40 border border-white/5 text-center">
                        <p class="text-xs text-gray-400 mb-1">ROOM DETAILS REVEAL IN</p>
                        <div id="countdown" class="text-3xl font-bold rajdhani tracking-widest text-white">00:00:00</div>
                    </div>
                    <div id="room-details" class="hidden mt-4 space-y-3">
                        <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                            <span class="text-xs text-gray-400">ROOM ID</span>
                            <div class="flex items-center gap-2">
                                <span id="room-id" class="font-bold text-blue-400"></span>
                                <button onclick="copyText('room-id')" class="text-[10px] bg-blue-600 px-2 py-1 rounded">COPY</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                            <span class="text-xs text-gray-400">PASSWORD</span>
                            <div class="flex items-center gap-2">
                                <span id="room-pass" class="font-bold text-blue-400"></span>
                                <button onclick="copyText('room-pass')" class="text-[10px] bg-blue-600 px-2 py-1 rounded">COPY</button>
                            </div>
                        </div>
                    </div>
                </div>
                <h3 class="rajdhani text-lg mb-4">PLAYERS JOINED</h3>
                <div id="lobby-players" class="grid grid-cols-2 gap-3"></div>
            </div>
            <div id="no-lobby" class="flex flex-col items-center justify-center pt-20 text-gray-500">
                <svg class="w-16 h-16 mb-4 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V5z" clip-rule="evenodd"/></svg>
                <p>No active lobby. Join a match first!</p>
            </div>
        </section>

        <section id="tab-wallet" class="tab-content">
            <div class="glass rounded-2xl p-6 mb-6 text-center">
                <p class="text-gray-400 text-sm">TOTAL BALANCE</p>
                <h1 class="text-5xl font-bold rajdhani text-blue-400 mt-2">₹<span id="wallet-balance">0</span></h1>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="openModal('deposit')" class="p-4 glass rounded-xl border-green-500/30 text-green-400 font-bold">ADD CASH</button>
                <button onclick="openModal('withdraw')" class="p-4 glass rounded-xl border-red-500/30 text-red-400 font-bold">WITHDRAW</button>
            </div>
            <h3 class="rajdhani text-lg mb-4">TRANSACTIONS</h3>
            <div id="transaction-list" class="space-y-3"></div>
        </section>

        <section id="tab-profile" class="tab-content">
            <div class="flex flex-col items-center mb-8">
                <div class="w-24 h-24 rounded-full border-4 border-blue-500 neon-glow-purple mb-4 overflow-hidden">
                    <img src="" id="profile-avatar-img" class="w-full h-full object-cover">
                </div>
                <h2 id="profile-name" class="text-2xl font-bold rajdhani">PLAYER</h2>
                <p id="profile-email" class="text-gray-400 text-sm"></p>
            </div>
            
            <div class="glass rounded-2xl p-6 mb-6">
                <p class="text-xs text-blue-400 font-bold mb-2">REFER & EARN</p>
                <div class="flex justify-between items-center mb-4">
                    <span id="my-ref-code" class="text-xl font-bold tracking-widest">---</span>
                    <button onclick="copyText('my-ref-code')" class="text-xs bg-white/10 px-3 py-2 rounded-lg">COPY</button>
                </div>
                <div id="referral-input-area">
                    <input type="text" id="apply-ref-code" placeholder="Enter Referral Code" class="w-full p-3 rounded-lg mb-2">
                    <button onclick="applyReferral()" class="w-full py-3 bg-blue-600 rounded-lg font-bold text-sm">APPLY CODE</button>
                </div>
            </div>

            <button onclick="firebase.auth().signOut()" class="w-full p-4 glass rounded-xl border-red-500/30 text-red-400 font-bold mb-4">LOGOUT</button>
        </section>
    </main>

    <div id="modal-container" class="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-6 hidden">
        <div id="modal-content" class="w-full glass rounded-2xl p-6 max-w-[400px]">
        </div>
    </div>

    <nav class="fixed bottom-0 w-full max-w-[448px] glass border-t border-white/10 px-4 py-2 flex justify-between items-center">
        <button onclick="switchTab('home')" class="nav-item flex flex-col items-center gap-1 active-tab" id="nav-home">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
            <span class="text-[10px]">Home</span>
        </button>
        <button onclick="switchTab('matches')" class="nav-item flex flex-col items-center gap-1 text-gray-500" id="nav-matches">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
            <span class="text-[10px]">Matches</span>
        </button>
        <button onclick="switchTab('play')" class="diamond-btn flex items-center justify-center text-white shadow-lg">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <button onclick="switchTab('wallet')" class="nav-item flex flex-col items-center gap-1 text-gray-500" id="nav-wallet">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"/></svg>
            <span class="text-[10px]">Wallet</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-item flex flex-col items-center gap-1 text-gray-500" id="nav-profile">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
            <span class="text-[10px]">Profile</span>
        </button>
    </nav>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBcloj_6nlULDHJ0CL_YQ_F5lgpEV1C1n0",
            authDomain: "esports-14a8e.firebaseapp.com",
            projectId: "esports-14a8e",
            storageBucket: "esports-14a8e.firebasestorage.app",
            messagingSenderId: "794935004500",
            appId: "1:794935004500:web:28baca51648602a89f0cc1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userData = null;
        let activeMatchId = null;

        // AUTH LOGIC
        function toggleAuth(isSignup) {
            document.getElementById('login-form').classList.toggle('hidden', isSignup);
            document.getElementById('signup-form').classList.toggle('hidden', !isSignup);
        }

        async function handleAuth(type) {
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');
            try {
                if (type === 'signup') {
                    const email = document.getElementById('reg-email').value;
                    const pass = document.getElementById('reg-pass').value;
                    const username = document.getElementById('reg-user').value;
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    const refCode = res.user.uid.substring(0, 6).toUpperCase();
                    await db.collection('users').doc(res.user.uid).set({
                        username, email, wallet: 0, referralCode: refCode, referredBy: null, 
                        joinedMatches: [], avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`
                    });
                } else {
                    const email = document.getElementById('auth-email').value;
                    const pass = document.getElementById('auth-password').value;
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (e) {
                errorEl.innerText = e.message;
                errorEl.classList.remove('hidden');
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                initUserListener();
                initBrandingListener();
                initTournamentListener();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        // REAL-TIME LISTENERS
        function initUserListener() {
            db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
                userData = doc.data();
                if (!userData) return;
                
                const walletEl = document.getElementById('wallet-balance');
                const avatarEl = document.getElementById('avatar-img');
                const profileAvatarEl = document.getElementById('profile-avatar-img');
                const profileNameEl = document.getElementById('profile-name');
                const profileEmailEl = document.getElementById('profile-email');
                const refCodeEl = document.getElementById('my-ref-code');
                const refInputAreaEl = document.getElementById('referral-input-area');
                
                if (walletEl) walletEl.innerText = userData.wallet || 0;
                if (avatarEl) avatarEl.src = userData.avatar || '';
                if (profileAvatarEl) profileAvatarEl.src = userData.avatar || '';
                if (profileNameEl) profileNameEl.innerText = userData.username || 'Player';
                if (profileEmailEl) profileEmailEl.innerText = userData.email || '';
                if (refCodeEl) refCodeEl.innerText = userData.referralCode || '---';
                if (userData.referredBy && refInputAreaEl) refInputAreaEl.classList.add('hidden');
                
                renderMyMatches();
            });
        }

        function initBrandingListener() {
            db.collection('branding').doc('general').onSnapshot(doc => {
                const data = doc.data();
                if (data) {
                    document.getElementById('app-logo').src = data.logoUrl;
                    document.getElementById('announcement').innerText = data.announcement;
                    document.getElementById('banner-img').src = data.bannerUrl;
                    document.getElementById('banner-text').innerText = data.bannerTitle;
                }
            });
        }

        function initTournamentListener() {
            db.collection('matches').orderBy('createdAt', 'desc').onSnapshot(snap => {
                window.allMatches = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
                renderTournaments(window.allMatches);
            });
        }

        // NAVIGATION
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab', 'text-gray-500'));
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) activeNav.classList.add('active-tab');
            else document.querySelectorAll('.nav-item').forEach(n => n.classList.add('text-gray-500'));
        }

        // RENDERING
        function renderTournaments(matches) {
            const list = document.getElementById('tournament-list');
            if (!list) return;
            
            list.innerHTML = matches.map(m => {
                const isJoined = userData?.joinedMatches?.includes(m.id) || false;
                const isFull = m.joinedCount >= m.maxPlayers;
                let btnHtml = '';

                if (m.status === 'Ended') {
                    btnHtml = `<button onclick="viewResults('${m.id}')" class="w-full py-2 bg-white/10 rounded-lg font-bold text-sm">VIEW RESULTS</button>`;
                } else if (isJoined) {
                    btnHtml = `<button onclick="enterLobby('${m.id}')" class="w-full py-2 bg-blue-600 rounded-lg font-bold text-sm">VIEW LOBBY</button>`;
                } else if (isFull) {
                    btnHtml = `<button disabled class="w-full py-2 bg-white/5 text-gray-500 rounded-lg font-bold text-sm">SLOTS FULL</button>`;
                } else {
                    btnHtml = `<button onclick="openJoinModal('${m.id}', ${m.entryFee})" class="w-full py-2 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg font-bold text-sm">JOIN MATCH</button>`;
                }

                return `
                <div class="glass rounded-2xl p-4 border-l-4 ${m.type === 'BGMI' ? 'border-blue-500' : 'border-orange-500'}">
                    <div class="flex gap-4 mb-4">
                        <img src="${m.gameLogo}" class="w-16 h-16 rounded-xl object-cover bg-black">
                        <div class="flex-1">
                            <h3 class="font-bold text-lg">${m.title}</h3>
                            <div class="flex justify-between text-[10px] text-gray-400 font-bold uppercase">
                                <span>${m.type} • ${m.map}</span>
                                <span class="text-blue-400">PRIZE: ₹${m.prizePool}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between text-xs mb-2">
                        <span class="text-gray-400">Entry: <span class="text-white">₹${m.entryFee}</span></span>
                        <span class="text-gray-400">${m.joinedCount}/${m.maxPlayers} Joined</span>
                    </div>
                    <div class="progress-bar mb-4">
                        <div class="progress-fill" style="width: ${(m.joinedCount/m.maxPlayers)*100}%"></div>
                    </div>
                    ${btnHtml}
                </div>`;
            }).join('');
        }

        function filterTournaments(type, btn) {
            // Remove highlight from all buttons
            const allButtons = document.querySelectorAll('#filter-tabs button');
            allButtons.forEach(b => b.classList.remove('filter-active'));

            // Highlight clicked button
            if (btn) {
                btn.classList.add('filter-active');
            }

            let filtered = window.allMatches || [];

            if (type !== 'All') {
                if (type === 'Upcoming') {
                    filtered = filtered.filter(m => m.status === 'Upcoming');
                } else {
                    filtered = filtered.filter(m => m.type === type);
                }
            }

            renderTournaments(filtered);
        }

        // JOIN LOGIC
        function openJoinModal(matchId, fee) {
            if (!userData) {
                alert('Loading user data...');
                return;
            }
            
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <h2 class="text-xl font-bold rajdhani mb-4">CONFIRM ENTRY</h2>
                <p class="text-sm text-gray-400 mb-4">Entry Fee: ₹${fee} | Balance: ₹${userData.wallet || 0}</p>
                <input type="text" id="game-uid" placeholder="Your Game UID" class="w-full p-3 rounded-lg mb-4">
                <div class="flex gap-3">
                    <button onclick="closeModal()" class="flex-1 py-3 bg-white/10 rounded-lg font-bold">CANCEL</button>
                    <button onclick="processJoin('${matchId}', ${fee})" class="flex-1 py-3 bg-blue-600 rounded-lg font-bold">JOIN NOW</button>
                </div>
            `;
        }

        async function processJoin(matchId, fee) {
            if (!userData) {
                alert('Loading user data...');
                return;
            }
            
            const uid = document.getElementById('game-uid').value;
            if (!uid) return alert('Enter Game UID');
            if ((userData.wallet || 0) < fee) return alert('Insufficient Balance');

            try {
                const batch = db.batch();
                const userRef = db.collection('users').doc(currentUser.uid);
                const matchRef = db.collection('matches').doc(matchId);
                const partRef = db.collection('matches').doc(matchId).collection('participants').doc(currentUser.uid);

                // This logic is client-side for demo, but should be a transaction for production concurrency
                await db.runTransaction(async (transaction) => {
                    const mDoc = await transaction.get(matchRef);
                    if (mDoc.data().joinedCount >= mDoc.data().maxPlayers) throw "Match Full";
                    
                    transaction.update(userRef, { 
                        wallet: (userData.wallet || 0) - fee,
                        joinedMatches: firebase.firestore.FieldValue.arrayUnion(matchId)
                    });
                    transaction.update(matchRef, { joinedCount: firebase.firestore.FieldValue.increment(1) });
                    transaction.set(partRef, { username: userData.username, gameUid: uid, avatar: userData.avatar, joinedAt: Date.now() });
                    
                    // Referral logic: update referrer if this is first match
                    if ((userData.joinedMatches || []).length === 0 && userData.referredBy) {
                        // Backend function usually handles this, we just mark it
                        transaction.update(userRef, { referralRewardTriggered: true });
                    }
                });

                closeModal();
                switchTab('matches');
            } catch (e) {
                alert(e);
            }
        }

        // LOBBY & COUNTDOWN
        let lobbyInterval;
        function enterLobby(matchId) {
            activeMatchId = matchId;
            switchTab('play');
            document.getElementById('no-lobby').classList.add('hidden');
            document.getElementById('lobby-view').classList.remove('hidden');
            
            db.collection('matches').doc(matchId).onSnapshot(doc => {
                const match = doc.data();
                document.getElementById('lobby-match-title').innerText = match.title;
                startCountdown(match.unlockTimestamp, match.roomId, match.roomPass);
            });

            db.collection('matches').doc(matchId).collection('participants').onSnapshot(snap => {
                document.getElementById('lobby-players').innerHTML = snap.docs.map(d => `
                    <div class="flex items-center gap-2 glass p-2 rounded-lg">
                        <img src="${d.data().avatar}" class="w-8 h-8 rounded-full border border-blue-500">
                        <span class="text-[10px] font-bold truncate">${d.data().username}</span>
                    </div>
                `).join('');
            });
        }

        function startCountdown(timestamp, id, pass) {
            clearInterval(lobbyInterval);
            const target = timestamp;
            lobbyInterval = setInterval(() => {
                const now = Date.now();
                const diff = target - now;
                if (diff <= 0) {
                    clearInterval(lobbyInterval);
                    document.getElementById('countdown').innerText = "UNLOCKED";
                    document.getElementById('room-details').classList.remove('hidden');
                    document.getElementById('room-id').innerText = id;
                    document.getElementById('room-pass').innerText = pass;
                } else {
                    const h = Math.floor(diff/3600000).toString().padStart(2, '0');
                    const m = Math.floor((diff%3600000)/60000).toString().padStart(2, '0');
                    const s = Math.floor((diff%60000)/1000).toString().padStart(2, '0');
                    document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
                }
            }, 1000);
        }

        // REFERRAL
        async function applyReferral() {
            if (!userData) {
                alert('Loading user data...');
                return;
            }
            
            const code = document.getElementById('apply-ref-code').value.trim();
            if (code === userData.referralCode) return alert("Can't use your own code");
            
            const refSnap = await db.collection('users').where('referralCode', '==', code).get();
            if (refSnap.empty) return alert("Invalid Code");
            
            await db.collection('users').doc(currentUser.uid).update({ referredBy: refSnap.docs[0].id });
            alert("Referral Applied!");
        }

        // WALLET TOOLS
        async function openModal(mode) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            if (mode === 'deposit') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold rajdhani mb-4">ADD BALANCE</h2>
                    <input type="number" id="dep-amt" placeholder="Amount (₹)" class="w-full p-3 rounded-lg mb-4">
                    <button onclick="processTransaction('deposit')" class="w-full py-3 bg-green-600 rounded-lg font-bold">PROCEED</button>
                `;
            } else {
                content.innerHTML = `
                    <h2 class="text-xl font-bold rajdhani mb-4">WITHDRAW</h2>
                    <input type="text" id="upi-id" placeholder="UPI ID (e.g. user@upi)" class="w-full p-3 rounded-lg mb-3">
                    <input type="number" id="wit-amt" placeholder="Amount (₹)" class="w-full p-3 rounded-lg mb-4">
                    <button onclick="processTransaction('withdraw')" class="w-full py-3 bg-red-600 rounded-lg font-bold">REQUEST WITHDRAWAL</button>
                `;
            }
        }

        async function processTransaction(type) {
            if (!userData) {
                alert('Loading user data...');
                return;
            }
            
            const amt = parseInt(document.getElementById(type === 'deposit' ? 'dep-amt' : 'wit-amt').value);
            if (!amt || amt <= 0) return alert('Enter valid amount');
            
            if (type === 'withdraw' && amt > (userData.wallet || 0)) return alert("Insufficient funds");

            const transRef = db.collection('transactions').doc();
            await transRef.set({
                userId: currentUser.uid,
                amount: amt,
                type: type,
                status: type === 'deposit' ? 'Success' : 'Pending',
                timestamp: Date.now(),
                upi: type === 'withdraw' ? document.getElementById('upi-id').value : 'N/A'
            });

            if (type === 'deposit') {
                await db.collection('users').doc(currentUser.uid).update({ wallet: (userData.wallet || 0) + amt });
            } else {
                await db.collection('users').doc(currentUser.uid).update({ wallet: (userData.wallet || 0) - amt });
            }
            closeModal();
            renderTransactions();
        }

        async function renderTransactions() {
            const snap = await db.collection('transactions').where('userId', '==', currentUser.uid).orderBy('timestamp', 'desc').limit(10).get();
            document.getElementById('transaction-list').innerHTML = snap.docs.map(d => {
                const t = d.data();
                return `
                <div class="glass p-3 rounded-xl flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold uppercase">${t.type}</p>
                        <p class="text-[10px] text-gray-500">${new Date(t.timestamp).toLocaleDateString()}</p>
                    </div>
                    <span class="font-bold ${t.type === 'deposit' ? 'text-green-400' : 'text-red-400'}">
                        ${t.type === 'deposit' ? '+' : '-'}₹${t.amount}
                    </span>
                </div>`;
            }).join('');
        }

        // HELPERS
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard');
        }
        function renderMyMatches() {
            const list = document.getElementById('my-matches-list');
            if (!list || !window.allMatches || !userData || !userData.joinedMatches) {
                if (list) list.innerHTML = '<p class="text-center text-gray-600 pt-10">No matches found</p>';
                return;
            }
            
            const my = window.allMatches.filter(m => userData.joinedMatches.includes(m.id));
            list.innerHTML = my.length ? my.map(m => `
                <div class="glass p-4 rounded-xl flex justify-between items-center border-l-2 border-blue-500">
                    <div>
                        <h4 class="font-bold">${m.title}</h4>
                        <p class="text-[10px] text-gray-400">${m.type} • ${m.status}</p>
                    </div>
                    <button onclick="enterLobby('${m.id}')" class="text-xs bg-blue-600 px-4 py-2 rounded-lg font-bold">OPEN</button>
                </div>
            `).join('') : '<p class="text-center text-gray-600 pt-10">No matches found</p>';
        }
    </script>
</body>
</html>
